<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" role="img" aria-label="Connect6 board illustration">
  <defs>
    <linearGradient id="hb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171d20"/>
      <stop offset="1" stop-color="#0b0e10"/>
    </linearGradient>
    <linearGradient id="hb-black" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3b454b"/>
      <stop offset="1" stop-color="#20272b"/>
    </linearGradient>
    <linearGradient id="hb-white" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fbf8f0"/>
      <stop offset="1" stop-color="#ddd7c8"/>
    </linearGradient>
    <filter id="hb-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="hb-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.2" flood-color="#f4bc6b" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="559" height="539" rx="22" fill="url(#hb-bg)" stroke="#ece7db" stroke-opacity="0.08"/>
  <rect x="18" y="18" width="524" height="504" rx="16" fill="none" stroke="#e3a043" stroke-opacity="0.16"/>
  <text x="40" y="48" font-family="Cascadia Mono, Consolas, monospace" font-size="9" letter-spacing="3.4" fill="#837d71">THICKEARTH</text>
  <text x="520" y="48" text-anchor="end" font-family="Cascadia Mono, Consolas, monospace" font-size="9" letter-spacing="2" fill="#837d71">19 × 19 · CONNECT6</text>

  <rect x="70" y="64" width="420" height="420" rx="8" fill="#0d1113" stroke="#ece7db" stroke-opacity="0.14"/>

  <!-- Every stone below sits on an intersection: x = 82 + 22i, y = 76 + 22j -->
  <g stroke="#ece7db" stroke-opacity="0.1" stroke-width="0.8">
    <path d="M82 76v396M104 76v396M126 76v396M148 76v396M170 76v396M192 76v396M214 76v396M236 76v396M258 76v396M280 76v396M302 76v396M324 76v396M346 76v396M368 76v396M390 76v396M412 76v396M434 76v396M456 76v396M478 76v396"/>
    <path d="M82 76h396M82 98h396M82 120h396M82 142h396M82 164h396M82 186h396M82 208h396M82 230h396M82 252h396M82 274h396M82 296h396M82 318h396M82 340h396M82 362h396M82 384h396M82 406h396M82 428h396M82 450h396M82 472h396"/>
  </g>
  <g fill="#ece7db" fill-opacity="0.3"><circle cx="148" cy="142" r="2.2"/><circle cx="148" cy="274" r="2.2"/><circle cx="148" cy="406" r="2.2"/><circle cx="280" cy="142" r="2.2"/><circle cx="280" cy="274" r="2.2"/><circle cx="280" cy="406" r="2.2"/><circle cx="412" cy="142" r="2.2"/><circle cx="412" cy="274" r="2.2"/><circle cx="412" cy="406" r="2.2"/></g>

  <!-- White keeps the diamond seat shape from the game board -->
  <g fill="url(#hb-white)" stroke="#07090a" stroke-opacity="0.45" stroke-width="1" filter="url(#hb-shadow)">
    <rect x="249" y="243" width="17" height="17" rx="2.5" transform="rotate(45 258 252)"/><rect x="293" y="221" width="17" height="17" rx="2.5" transform="rotate(45 302 230)"/><rect x="271" y="265" width="17" height="17" rx="2.5" transform="rotate(45 280 274)"/><rect x="205" y="309" width="17" height="17" rx="2.5" transform="rotate(45 214 318)"/><rect x="315" y="221" width="17" height="17" rx="2.5" transform="rotate(45 324 230)"/><rect x="227" y="221" width="17" height="17" rx="2.5" transform="rotate(45 236 230)"/><rect x="337" y="199" width="17" height="17" rx="2.5" transform="rotate(45 346 208)"/><rect x="271" y="177" width="17" height="17" rx="2.5" transform="rotate(45 280 186)"/>
  </g>

  <g fill="url(#hb-black)" stroke="#ece7db" stroke-opacity="0.4" stroke-width="1" filter="url(#hb-shadow)">
    <circle cx="236" cy="340" r="8.6"/><circle cx="170" cy="318" r="8.6"/>
  </g>

  <!-- The winning run: six diagonal stones ringed in gold, as the game draws them -->
  <g fill="url(#hb-black)" stroke="#ece7db" stroke-opacity="0.55" stroke-width="1" filter="url(#hb-glow)">
    <circle cx="192" cy="296" r="8.6"/><circle cx="214" cy="274" r="8.6"/><circle cx="236" cy="252" r="8.6"/><circle cx="258" cy="230" r="8.6"/><circle cx="280" cy="208" r="8.6"/><circle cx="302" cy="186" r="8.6"/>
  </g>
  <g fill="none" stroke="#f4bc6b" stroke-opacity="0.85" stroke-width="1.3">
    <circle cx="192" cy="296" r="11.4"/><circle cx="214" cy="274" r="11.4"/><circle cx="236" cy="252" r="11.4"/><circle cx="258" cy="230" r="11.4"/><circle cx="280" cy="208" r="11.4"/><circle cx="302" cy="186" r="11.4"/>
  </g>

  <text x="280" y="512" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="8.5" letter-spacing="2.6" fill="#5f5a51">DETERMINISTIC · PERFECT INFORMATION</text>
  <g stroke="#f6c473" stroke-opacity="0.5" stroke-width="1.4">
    <path d="M28 66h12M28 66v12M532 66h-12M532 66v12M28 474h12M28 474v-12M532 474h-12M532 474v-12"/>
  </g>
</svg>
