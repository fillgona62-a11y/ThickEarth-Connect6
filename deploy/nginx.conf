# ThickEarth behind nginx. Drop into /etc/nginx/conf.d/thickearth.conf
#
# Two details matter more than the rest:
#   1. SSE (`/api/games/:gameId/events`) needs `proxy_buffering off`, or live game
#      updates arrive in bursts instead of as they happen.
#   2. `PUBLIC_ORIGIN` in the systemd unit must equal this server_name + scheme,
#      because the app rejects state-changing requests from other origins.

server {
    listen 80;
    listen [::]:80;
    server_name thickearth.example.com;

    # Keep ACME reachable if you use certbot --webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thickearth.example.com;

    ssl_certificate     /etc/letsencrypt/live/thickearth.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thickearth.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Server-sent events: never buffer, and allow a long-lived stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
